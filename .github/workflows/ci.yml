name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DVERSIONARY_GITHUB_CLIENT_ID=dummy
          -DVERSIONARY_GITHUB_CLIENT_SECRET=dummy
          -DVERSIONARY_BITBUCKET_CLIENT_ID=dummy
          -DVERSIONARY_BITBUCKET_CLIENT_SECRET=dummy
          -DVERSIONARY_GITLAB_CLIENT_ID=dummy
          -DVERSIONARY_GITLAB_CLIENT_SECRET=dummy

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: build/Testing/Temporary/LastTest.log
